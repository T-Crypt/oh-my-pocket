name: CI

on:
    push:
        branches:
            - main
            - oh-my-pocket
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ["22.19", "24"]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - run: npm ci
            - run: npm run check
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
