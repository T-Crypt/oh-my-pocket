name: CI

on:
    push:
        branches:
            - main
            - oh-my-pocket
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ["22.19", "24"]
        env:
            # A path that is not a file makes findBrowser() return undefined, so the 137 tests that need a browser
            # skip themselves and say why; the other 503 tests, and the checks above, still fail the job. The
            # reason is the runner's browser, not the suite: the deb's Chrome 154 starts and passes most of the
            # suite, then a wait this suite makes never resolves, a different one each run, with a thirty second
            # budget expired and 638 of 640 tests green (runs 38431886203 and 38433132571, the 22.19 leg).
            PI_POCKET_BROWSER: /nonexistent-browser-on-ci
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - run: npm ci
            - run: npm run check
            - run: npm run check:web
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
